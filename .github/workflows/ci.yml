# ================================
# E-Library System CI/CD Pipeline
# ================================
# This workflow builds, tests, and packages the application
# on every push and pull request

name: CI Pipeline

on:
  push:
    branches: [main, dev, develop, feature/*]
  pull_request:
    branches: [main, dev, develop]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ================================
  # Backend Build & Test
  # ================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: elibrary_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d elibrary_test"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    defaults:
      run:
        working-directory: ./backend

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/elibrary_test
      SPRING_DATASOURCE_USERNAME: test_user
      SPRING_DATASOURCE_PASSWORD: test_pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean compile -B

      - name: Run Unit Tests
        run: ./mvnw test -B

      - name: Run Integration Tests
        run: ./mvnw verify -B -DskipUnitTests

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/

      - name: Package Application
        run: ./mvnw package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ================================
  # Frontend Build & Test
  # ================================
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm run test -- --run
        continue-on-error: true

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ================================
  # Docker Build
  # ================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: elibrary-backend:${{ github.sha }}
          no-cache: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: elibrary-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================
  # Docker Compose Integration Test
  # ================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: elibrary
          POSTGRES_USER: elibrary_user
          POSTGRES_PASSWORD: elibrary_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U elibrary_user -d elibrary"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U elibrary_user -d elibrary && break
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"

      - name: Create .env file
        run: |
          cat > .env << EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=elibrary
          DB_USER=elibrary_user
          DB_PASSWORD=elibrary_pass
          BACKEND_PORT=8080
          EOF

      - name: Start containers
        run: docker compose up -d

      - name: Inspect backend configuration
        run: |
          echo "=== Backend container environment ===" 
          docker compose exec -T backend env | grep -E "(DB_|SPRING)" || true
          echo ""
          echo "=== Initial backend logs ==="
          docker compose logs backend | tail -50

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          # Max 30 attempts, 5 seconds apart
          for i in {1..30}; do
            if curl -f http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "⏳ Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "❌ Backend failed to become healthy in time"
          docker compose logs backend
          exit 1

      - name: Run API smoke tests
        run: |
          echo "Testing API endpoints..."
          curl -f http://localhost:8080/api/books || exit 1
          curl -f http://localhost:8080/api/users || exit 1
          curl -f http://localhost:8080/api/categories || exit 1
          echo "✅ API smoke tests passed!"

      - name: Collect Docker logs
        if: failure()
        run: docker compose logs > docker-logs.txt

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Stop containers
        if: always()
        run: docker compose down -v
