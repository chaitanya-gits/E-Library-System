# ================================
# E-Library System GitLab CI/CD Pipeline
# ================================
# This pipeline builds, tests, and packages the application
# on every push and merge request

stages:
  - build
  - test
  - docker
  - integration

variables:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

# Cache configuration for faster builds
.maven-cache: &maven-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-maven
    paths:
      - backend/.m2/repository
      - backend/target

.npm-cache: &npm-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - frontend/node_modules
      - frontend/.npm

# ================================
# Backend Build & Test
# ================================
backend-build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache

  services:
    - postgres:15-alpine

  variables:
    POSTGRES_DB: elibrary_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    SPRING_PROFILES_ACTIVE: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/elibrary_test
    SPRING_DATASOURCE_USERNAME: test_user
    SPRING_DATASOURCE_PASSWORD: test_pass

  before_script:
    - cd backend
    - chmod +x mvnw

  script:
    - echo "Building backend..."
    - ./mvnw clean compile $MAVEN_CLI_OPTS
    - echo "✅ Backend build successful"

  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  needs:
    - backend-build

  services:
    - postgres:15-alpine

  variables:
    POSTGRES_DB: elibrary_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    SPRING_PROFILES_ACTIVE: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/elibrary_test
    SPRING_DATASOURCE_USERNAME: test_user
    SPRING_DATASOURCE_PASSWORD: test_pass

  before_script:
    - cd backend
    - chmod +x mvnw

  script:
    - echo "Running unit tests..."
    - ./mvnw test $MAVEN_CLI_OPTS
    - echo "Running integration tests..."
    - ./mvnw verify $MAVEN_CLI_OPTS -DskipUnitTests
    - echo "✅ All backend tests passed"

  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    expire_in: 1 week

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

backend-package:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  needs:
    - backend-test

  before_script:
    - cd backend
    - chmod +x mvnw

  script:
    - echo "Packaging backend application..."
    - ./mvnw package -DskipTests $MAVEN_CLI_OPTS
    - echo "✅ Backend packaging complete"

  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 7 days

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ================================
# Frontend Build & Test
# ================================
frontend-build:
  stage: build
  image: node:20-alpine
  <<: *npm-cache

  before_script:
    - cd frontend

  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Running linter..."
    - npm run lint || echo "⚠️ Linting issues detected"
    - echo "Running tests..."
    - npm run test -- --run || echo "⚠️ Some tests failed"
    - echo "Building for production..."
    - npm run build
    - echo "✅ Frontend build successful"

  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ================================
# Docker Build
# ================================
docker-backend:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  needs:
    - backend-package
    - frontend-build

  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - docker info

  script:
    - echo "Building backend Docker image..."
    - cd backend
    - docker build -t elibrary-backend:$CI_COMMIT_SHA -t elibrary-backend:latest .
    - echo "✅ Backend Docker image built successfully"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docker-frontend:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  needs:
    - frontend-build

  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - docker info

  script:
    - echo "Building frontend Docker image..."
    - cd frontend
    - docker build -t elibrary-frontend:$CI_COMMIT_SHA -t elibrary-frontend:latest .
    - echo "✅ Frontend Docker image built successfully"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ================================
# Integration Test
# ================================
integration-test:
  stage: integration
  image: eclipse-temurin:21-jdk
  services:
    - postgres:15-alpine
  needs:
    - backend-package

  variables:
    POSTGRES_DB: elibrary
    POSTGRES_USER: elibrary_user
    POSTGRES_PASSWORD: elibrary_pass
    SPRING_PROFILES_ACTIVE: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/elibrary
    SPRING_DATASOURCE_USERNAME: elibrary_user
    SPRING_DATASOURCE_PASSWORD: elibrary_pass

  before_script:
    - apt-get update && apt-get install -y curl postgresql-client

  script:
    - echo "Waiting for PostgreSQL to be ready..."
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 -U elibrary_user -d elibrary && break
        echo "Waiting for postgres... ($i/30)"
        sleep 2
      done
    - echo "✅ PostgreSQL is ready!"
    - echo "Starting backend application..."
    - cd backend
    - nohup java -jar target/*.jar > ../backend.log 2>&1 &
    - echo $! > backend.pid
    - echo "Started backend with PID $(cat backend.pid)"
    - sleep 10

    - |
      if ps -p $(cat backend.pid) > /dev/null; then
        echo "✅ Backend process is running"
      else
        echo "❌ Backend process died immediately"
        echo "=== Backend Logs ==="
        cat ../backend.log
        exit 1
      fi

    - echo "Waiting for backend to be healthy..."
    - |
      for i in {1..60}; do
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
        
        if [ "$response" = "200" ]; then
          echo "✅ Backend is healthy!"
          break
        fi
        
        echo "⏳ Waiting for backend... ($i/60) [HTTP $response]"
        
        if [ -f backend.pid ] && ! ps -p $(cat backend.pid) > /dev/null 2>&1; then
          echo "❌ Backend process died!"
          echo "=== Backend Logs ==="
          tail -100 ../backend.log
          exit 1
        fi
        
        sleep 5
      done

    - echo "Testing API endpoints..."
    - curl -f http://localhost:8080/api/books || exit 1
    - curl -f http://localhost:8080/api/users || exit 1
    - curl -f http://localhost:8080/api/categories || exit 1
    - echo "✅ API smoke tests passed!"

  after_script:
    - |
      if [ -f backend/backend.pid ]; then
        kill $(cat backend/backend.pid) || true
        rm backend/backend.pid
      fi

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
