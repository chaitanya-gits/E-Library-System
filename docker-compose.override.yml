# ================================
# Docker Compose Override for Development
# ================================

services:
  backend:
    build:
      context: ./backend
      target: builder
    volumes:
      - ./backend/src:/app/src
      - ./backend/target:/app/target
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      LOGGING_LEVEL_COM_ELIBRARY: DEBUG
    ports:
      - "8080:8080"
      - "5005:5005"
    command: >
      ./mvnw spring-boot:run
      -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: /api
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
      VITE_AUTH_BASE_URL: http://localhost:8080
    ports:
      - "3000:5173"
    command: npm run dev -- --host
