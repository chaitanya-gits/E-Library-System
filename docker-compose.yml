# ================================
# Docker Compose for E-Library System
# ================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elibrary-backend

    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    networks:
      - elibrary-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: elibrary-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - elibrary-network
    restart: unless-stopped

networks:
  elibrary-network:
    driver: bridge
