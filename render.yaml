# ================================
# Render.com Blueprint Configuration
# E-Library System - Full Stack Deployment
# ================================
# This file enables one-click deployment to Render.com
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ================================
  # Backend Service (Spring Boot API)
  # ================================
  - type: web
    name: elibrary-backend
    runtime: docker
    repo: https://gitlab.com/chaitaanya10/e-library-system
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Resource allocation
    plan: free
    region: oregon # Choose: oregon, frankfurt, singapore

    # Health check configuration
    healthCheckPath: /actuator/health

    # Environment variables
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker

      - key: DB_HOST
        sync: false # User will set this manually in Render dashboard

      - key: DB_PORT
        value: "5432"

      - key: DB_NAME
        sync: false # User will set this manually

      - key: DB_USER
        sync: false # User will set this manually

      - key: DB_PASSWORD
        sync: false # User will set this manually (encrypted in Render)

      - key: PORT
        value: "8080"

      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

    # Auto-deploy on git push
    autoDeploy: true

  # ================================
  # Frontend Service (React + Nginx)
  # ================================
  - type: web
    name: elibrary-frontend
    runtime: docker
    repo: https://gitlab.com/chaitaanya10/e-library-system
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

    # Resource allocation
    plan: free
    region: oregon # Should match backend region

    # Build arguments
    dockerCommand: nginx -g 'daemon off;'

    # Environment variables for build
    envVars:
      - key: VITE_API_URL
        # This will be set to the backend URL after deployment
        # Format: https://elibrary-backend.onrender.com/api
        sync: false

    # Auto-deploy on git push
    autoDeploy: true
# ================================
# Optional: Render PostgreSQL Database
# ================================
# Uncomment below if you want to use Render's PostgreSQL instead of an external provider
